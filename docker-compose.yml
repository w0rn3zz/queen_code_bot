services:
  bot:
    # bot
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      - db
      - redis

  db:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:6-alpine
    volumes:
      - ./src/core/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - ./redis/data:/data
    command: "redis-server /usr/local/etc/redis/redis.conf"
    healthcheck:
      test: redis-cli ping
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped